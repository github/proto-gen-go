name: Docker

permissions:
  contents: read

on:
  push: {}
  pull_request: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker Image
        run: docker build -t proto-gen-go .
